# VeritasDocs — default values.yaml (SaaS/API-connected profile).
# For the air-gapped profile, layer values-airgapped.yaml on top:
#   helm install veritasdocs ./helm/veritasdocs -f values-airgapped.yaml
#
# SCOPE NOTE (T93): this chart deploys the full stack air-gapped-capable
# for embeddings (bgem3), reranking (bgem3) and OCR (pdfplumber or
# paddleocr — paddleocr has real Devanagari/Marathi support, T90), all of
# which run as genuinely local models. It cannot yet deploy a working
# *air-gapped* LLM or VLM path — no local provider for those exists in
# this codebase (T90's VLM half is unverified scaffolding, no GPU
# available to validate it). With airGapped.enabled=true the
# backend/worker refuse to start any call that would reach an external
# LLM/VLM API rather than silently calling out; see
# backend/app/ai/airgapped.py. Closing that gap for real requires a
# GPU-verified local Qwen2.5-VL provider — separate follow-up work.

global:
  storageClass: ""   # "" = cluster default StorageClass

image:
  registry: ""        # e.g. "registry.airgapped.local:5000/" — include trailing slash; "" for Docker Hub / public
  backend:
    repository: veritasdocs-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: veritasdocs-frontend
    tag: latest
    pullPolicy: IfNotPresent

imagePullSecrets: []   # e.g. [{name: airgapped-registry-creds}]

# ─── Air-gapped toggle (T91, partial) ────────────────────────────────────
airGapped:
  enabled: false

# ─── App-level config (non-secret) ───────────────────────────────────────
app:
  env: production
  corsOrigins: '["http://localhost:3000"]'

  logLevel: INFO
  # SQLAlchemy echoes every statement and its bound parameters at INFO, which
  # drowns the application's own log lines. Raise only when debugging SQL.
  sqlLogLevel: WARNING

  # REQUIRED: email of an existing user in this install. Every connector
  # (SFTP, watched-folder, email-in, scanner) attributes ingested documents
  # to this account; if no user has this email, every connector poll fails.
  # Deliberately empty so a deploy fails loudly at template time rather than
  # silently shipping a placeholder that breaks ingestion at runtime.
  connectorActorEmail: ""

  ai:
    llmProvider: openai
    embedProvider: bgem3
    embedFallbackProvider: none
    rerankProvider: cohere
    ocrProvider: pdfplumber
    vlmProvider: gemini

# ─── Secrets (values below are INSECURE PLACEHOLDERS) ───────────────────
# Do not deploy to a real environment with these defaults. Override with
# --set or a private values file kept out of git (see the runbook).
secrets:
  postgresPassword: "change_me_in_production"
  # T93 clean-room finding: password for the restricted `dms_app` Postgres
  # role migration 0046 creates (D-2 RLS fix) — that migration raises if
  # this isn't set at all, so a value is required here even though it's a
  # placeholder like the others.
  appDbPassword: "change_me_in_production"
  redisPassword: "change_me_in_production"
  jwtSecretKey: "generate_with_openssl_rand_hex_32__min_32_chars"
  s3AccessKeyId: "minioadmin"
  s3SecretAccessKey: "minioadmin"
  openaiApiKey: ""
  anthropicApiKey: ""
  groqApiKey: ""
  googleApiKey: ""
  cohereApiKey: ""
  llamaparseApiKey: ""
  # T93 clean-room finding: added along with the Chandra OCR/VLM provider
  # (backend/app/ai/providers/chandra_provider.py) — this chart had no
  # field for it at all, so app.ai.ocrProvider/vlmProvider: chandra would
  # silently run with an empty settings.datalab_api_key rather than a
  # real one, same class of drift as APP_DB_PASSWORD above.
  datalabApiKey: ""

# ─── Bundled stateful dependencies ───────────────────────────────────────
# Self-contained StatefulSets (no external chart repo dependency) so an
# air-gapped mirror only has to carry these three extra images.
postgres:
  image: ankane/pgvector:latest
  storageSize: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

redis:
  image: redis:7-alpine
  storageSize: 5Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

minio:
  image: minio/minio:latest
  storageSize: 50Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  buckets:
    - docsearch-documents
    - docsearch-archive

# ─── HuggingFace model cache (T93 clean-room finding) ────────────────────
# bgem3 (embeddings + reranking) downloads its weights from huggingface.co
# on first use via sentence_transformers -- docker-compose.yml gives
# backend+worker a shared `hf_cache` named volume for exactly this reason
# (see its `hf_cache:` volume), but this chart had no equivalent, so every
# fresh pod re-downloaded the full model from the internet. That's just
# slow for the SaaS profile, but it's a real correctness gap for the
# air-gapped profile: huggingface.co is NOT in egress_guard's
# BLOCKED_AI_HOSTS (app/ai/egress_guard.py) -- a genuinely air-gapped
# network has no route there at all, so the runbook's "Embeddings: Works"
# claim under AIR_GAPPED=true is only true if this cache was already
# populated before the network was cut. See the runbook's own new section
# on pre-seeding this before an air-gapped transfer.
#
# ReadWriteOnce, not ReadWriteMany: broadly portable (most StorageClasses
# support RWO; few support RWX), sufficient as long as backend+worker pods
# land on the same node -- true for this chart's assumed small/single-node
# deployments (postgres/redis/minio are single-replica StatefulSets, not
# built for multi-node HA yet either). A genuinely multi-node HA install
# needs an RWX-capable StorageClass here instead; not attempted in this
# pass.
hfCache:
  enabled: true
  storageSize: 10Gi

# ─── Application components ──────────────────────────────────────────────
backend:
  replicas: 2
  resources:
    # T93 clean-room finding: OOMKilled (exit 137) at the default 4Gi
    # limit the first time a backend pod actually loaded the bgem3
    # embedding model in-process for query-time embedding -- the same
    # model worker.yaml already budgets 6Gi for below, but backend had
    # less headroom despite doing the same in-process model load.
    # Reproduced live 2026-09-07: `kubectl describe pod` showed
    # `Last State: Terminated, Reason: OOMKilled` right after "Loading
    # weights: 100%" in the logs, no Python traceback (SIGKILL, not a
    # catchable exception). Matched worker's limit, which survived the
    # identical model load without issue.
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 6Gi }

worker:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 6Gi }

# Celery Beat (scheduler). No `replicas` key on purpose — it is pinned to 1 in
# the template because a second Beat double-fires every scheduled task. It only
# enqueues, never executes, so it needs far less than a worker.
beat:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 250m, memory: 512Mi }

flower:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: false
  className: nginx
  host: veritasdocs.local
  tls:
    enabled: false
    secretName: ""

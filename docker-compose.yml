services:
  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5433:5432"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: docsearch
      POSTGRES_USER: docsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - ./backend/.env
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  sftp:
    image: atmoz/sftp:latest
    ports:
      - "2222:22"
    # The named volume below is created root-owned on first use, which leaves
    # the connector user (uid 1001) able to list/read but not write into its
    # own upload dir. Chown it (and pre-create the processed/failed subdirs)
    # before handing off to the image's real entrypoint.
    entrypoint: >
      sh -c "mkdir -p /home/connector/upload/processed /home/connector/upload/failed &&
             chown -R 1001:1001 /home/connector/upload &&
             exec /entrypoint connector:${SFTP_PASSWORD:-connector123}:1001:1001:upload"
    volumes:
      - sftp_data:/home/connector/upload
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # Local mail server for the email-in connector demo. GREENMAIL_OPTS below
  # pins one fixed mailbox (connector@dms.local / connector123) so the demo
  # doesn't depend on real internet email delivery — send to this box over
  # SMTP on port 3025, the backend polls it over IMAP on port 3143.
  mailserver:
    image: greenmail/standalone:latest
    ports:
      - "3025:3025"
      - "3143:3143"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=connector:connector123@dms.local -Dgreenmail.auth.disabled=false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      OMP_NUM_THREADS: "2"
      OMP_WAIT_POLICY: "PASSIVE"
      MKL_NUM_THREADS: "2"
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
      - ./connector_inbox/watched_folder:/app/watched_inbox
      - "/home/stark/Stark Drive :/app/stark_drive_inbox"
      - connector_state:/app/_state
    working_dir: /app
    command: >
      sh -c "alembic upgrade head && echo 'Backend API Docs: http://localhost:8000/api/docs' && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      
  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      OMP_NUM_THREADS: "2"
      OMP_WAIT_POLICY: "PASSIVE"
      MKL_NUM_THREADS: "2"
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    working_dir: /app
    command: >
      sh -c "celery -A app.tasks.worker.celery_app worker --loglevel=info"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # Celery Beat — the scheduler that actually fires celery_app.conf.beat_schedule.
  # Without it the worker above only ever runs tasks something else enqueues, so
  # the daily 30-day trash purge (app.tasks.cleanup_trashed_items_task) was
  # defined but had never once run. Beat only enqueues; the worker executes.
  # Keep exactly one replica — two beats means every scheduled task fires twice.
  beat:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - celery_beat_state:/var/lib/celery
    working_dir: /app
    command: >
      sh -c "celery -A app.tasks.worker.celery_app beat --loglevel=info
      --schedule /var/lib/celery/celerybeat-schedule"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  flower:
    build: ./backend
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "celery -A app.tasks.worker.celery_app flower --port=5555"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default


  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "echo 'Frontend Application: http://localhost:3000' && rm -rf .next/* out && npm run build && npm start"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
  sftp_data:
  connector_state:
  # Beat's own schedule//last-run-time database. Persisted so a restart doesn't
  # re-fire (or silently skip) a daily task depending on when it came back up.
  celery_beat_state:

networks:
  default:
    driver: bridge